<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas</title>
</head>
<body>
    <h1>Estatísticas dos Primos</h1>

    <p>Total de Jogos: <span id="totalJogos">0</span></p>

    <p>Total de Vitórias: <span id="totalVitorias">0</span></p>

    <p>Total de Empates: <span id="totalEmpates">0</span></p>

    <p>Total de Derrotas: <span id="totalDerrotas">0</span></p>

    <p>Total de Gols Marcados: <span id="totalGolsMarcados">0</span></p>

    <p>Total de Gols Sofridos: <span id="totalGolsSofridos">0</span></p>



    <h2>Estatísticas dos Jogadores</h2>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Posição</th>
                <th>Jogos</th>
                <th>Gols</th>
                <th>Assistências</th>
                <th>Cartões Amarelos</th>
                <th>Cartões Vermelhos</th>
            </tr>
        </thead>
        <tbody id="listaEstatisticasJogadores">
        </tbody>
    </table>

    <script src="../js/estatistica.js"></script>
</body>
</html>
